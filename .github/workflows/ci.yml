name: Public demo checks
on:
  pull_request:
  push:
    branches: [main, fix/public-demo-trial]
permissions:
  contents: read
jobs:
  regression-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run deploy:dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: public-demo-${{ github.sha }}
          path: dist/
          if-no-files-found: error
